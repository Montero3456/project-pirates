<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Pirates</title>

    <style>
        :root {
            --bg: #080a0e;
            --surface: rgba(20, 24, 31, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f5f7fa;
            --muted: #8e98a6;
            --accent: #ffb52e;
            --accent-hover: #ffc95b;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at 20% 0%,
                    rgba(255, 181, 46, 0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 10%,
                    rgba(80, 100, 255, 0.06),
                    transparent 30%
                ),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            position: relative;
            padding: 75px 20px 60px;
            text-align: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }

        header::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 181, 46, 0.08);
            filter: blur(100px);
            border-radius: 50%;
            top: -300px;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo {
            position: relative;
            font-size: 55px;
            margin-bottom: 10px;
        }

        header h1 {
            position: relative;
            margin: 0;
            font-size: clamp(38px, 6vw, 60px);
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(
                135deg,
                #ffffff,
                #ffb52e
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            position: relative;
            margin: 15px auto 0;
            max-width: 600px;
            color: var(--muted);
            font-size: 16px;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 35px 20px 60px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 550px;
        }

        .search-icon {
            position: absolute;
            left: 17px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 19px;
            pointer-events: none;
        }

        .search {
            width: 100%;
            padding: 15px 18px 15px 47px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            backdrop-filter: blur(15px);
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.25s ease;
        }

        .search::placeholder {
            color: #68717e;
        }

        .search:focus {
            border-color: rgba(255, 181, 46, 0.5);
            box-shadow:
                0 0 0 4px rgba(255, 181, 46, 0.08);
        }

        .file-count {
            color: var(--muted);
            font-size: 14px;
            white-space: nowrap;
        }

        .file-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(290px, 1fr));
            gap: 24px;
        }

        .file-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;

            animation: fadeIn 0.4s ease both;
        }

        .file-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 181, 46, 0.35);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35),
                0 0 30px rgba(255, 181, 46, 0.04);
        }

        .thumbnail-wrapper {
            position: relative;
            height: 190px;
            overflow: hidden;
            background: #0e1116;
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .file-card:hover .thumbnail {
            transform: scale(1.05);
        }

        .thumbnail-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    transparent 45%,
                    rgba(8, 10, 14, 0.75)
                );

            pointer-events: none;
        }

        .file-info {
            padding: 20px;
        }

        .file-name {
            margin: 0 0 9px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
            min-height: 45px;
        }

        .metadata {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin: 17px 0;
        }

        .tag {
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #aeb6c2;
            border-radius: 7px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            width: 100%;
            padding: 13px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    #f5a51c
                );

            color: #111;
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;

            transition: 0.2s ease;

            box-shadow:
                0 5px 18px rgba(255, 181, 46, 0.12);
        }

        .download-btn:hover {
            background:
                linear-gradient(
                    135deg,
                    var(--accent-hover),
                    var(--accent)
                );

            transform: translateY(-1px);

            box-shadow:
                0 8px 25px rgba(255, 181, 46, 0.2);
        }

        .download-btn:active {
            transform: translateY(1px);
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 80px 20px;
            display: none;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        footer {
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 30px 20px;
            color: #59626e;
            font-size: 13px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {

            header {
                padding: 55px 20px 45px;
            }

            .logo {
                font-size: 45px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-wrapper {
                max-width: none;
            }

            .file-count {
                text-align: center;
            }

            .file-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">
            🏴‍☠️
        </div>

        <h1>
            Project Pirates
        </h1>

        <p>
            A collection of files, projects, and downloads.
        </p>

    </header>


    <main class="container">

        <div class="top-bar">

            <div class="search-wrapper">

                <span class="search-icon">
                    🔎
                </span>

                <input
                    type="text"
                    id="search"
                    class="search"
                    placeholder="Search files..."
                    autocomplete="off"
                >

            </div>

            <div
                class="file-count"
                id="fileCount"
            >
                0 files
            </div>

        </div>


        <div
            id="fileGrid"
            class="file-grid"
        ></div>


        <div
            id="empty"
            class="empty"
        >

            <div class="empty-icon">
                🔎
            </div>

            <div>
                No files found.
            </div>

        </div>

    </main>


    <footer>
        Project Pirates &copy; 2026
    </footer>


    <script src="script.js"></script>

</body>
</html>
